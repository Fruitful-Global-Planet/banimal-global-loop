    <!-- Banimal — dark mode (warm charcoal, NYC-precise) + system-aware, persisted -->
    <style id="banimal-theme-polish">
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      html, body { transition: background-color .45s cubic-bezier(.4,0,.2,1), color .45s cubic-bezier(.4,0,.2,1); }
      html.dark img:not([src*=".svg"]) { filter: brightness(.94) contrast(1.02); }
      #banimal-theme-toggle {
        position: fixed; right: 1.5rem; bottom: 1.5rem; z-index: 2147483000;
        width: 46px; height: 46px; display: grid; place-items: center;
        border-radius: 9999px; cursor: pointer; padding: 0;
        background: hsl(var(--card) / .72);
        border: 1px solid hsl(var(--border));
        color: hsl(var(--foreground));
        -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
        box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px -8px rgba(0,0,0,.22);
        transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .45s ease, border-color .45s ease, box-shadow .45s ease;
      }
      #banimal-theme-toggle:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 2px 4px rgba(0,0,0,.10), 0 14px 34px -10px rgba(0,0,0,.30); }
      #banimal-theme-toggle:active { transform: translateY(0) scale(.97); }
      #banimal-theme-toggle:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 3px; }
      #banimal-theme-toggle svg { width: 20px; height: 20px; transition: opacity .4s ease, transform .5s cubic-bezier(.4,0,.2,1); }
      #banimal-theme-toggle .bt-sun { position: absolute; opacity: 1; transform: rotate(0) scale(1); }
      #banimal-theme-toggle .bt-moon { position: absolute; opacity: 0; transform: rotate(-90deg) scale(.6); }
      html.dark #banimal-theme-toggle .bt-sun { opacity: 0; transform: rotate(90deg) scale(.6); }
      html.dark #banimal-theme-toggle .bt-moon { opacity: 1; transform: rotate(0) scale(1); }
      @media (prefers-reduced-motion: reduce) { html, body, #banimal-theme-toggle, #banimal-theme-toggle svg { transition: none !important; } }
    </style>
    <script>
      (function () {
        var KEY = 'banimal-theme';
        var root = document.documentElement;
        function systemDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
        function resolve(){ var s = localStorage.getItem(KEY); return s ? s === 'dark' : systemDark(); }
        function apply(dark){ root.classList.toggle('dark', !!dark); }
        // Apply before first paint — no flash.
        apply(resolve());
        // Follow the OS while the user hasn't made an explicit choice.
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
            if (!localStorage.getItem(KEY)) apply(e.matches);
          });
        }
        function mount(){
          if (document.getElementById('banimal-theme-toggle')) return;
          var btn = document.createElement('button');
          btn.id = 'banimal-theme-toggle';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Toggle dark mode');
          btn.setAttribute('title', 'Toggle theme');
          btn.innerHTML =
            '<svg class="bt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.4 12H5M19 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>' +
            '<svg class="bt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8 8 0 1 1 9.8 3.5a6.4 6.4 0 0 0 10.7 10.7Z"/></svg>';
          btn.addEventListener('click', function () {
            var dark = !root.classList.contains('dark');
            apply(dark);
            localStorage.setItem(KEY, dark ? 'dark' : 'light');
          });
          document.body.appendChild(btn);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
        else mount();
      })();
    </script>

    <style id="banimal-basket-boost-style">
      #banimal-basket-boost{position:fixed;inset:0;z-index:2147482999;display:none;justify-content:flex-end;background:rgba(30,22,12,.34);backdrop-filter:blur(5px)}
      #banimal-basket-boost.show{display:flex}
      .bb-panel{width:min(100%,420px);height:100%;overflow:auto;background:#f6f1e7;box-shadow:-18px 0 48px rgba(30,22,12,.24);font-family:Inter,system-ui,sans-serif;color:#2c2118}
      .bb-head{position:sticky;top:0;background:rgba(246,241,231,.96);backdrop-filter:blur(10px);border-bottom:1px solid #e8deca;padding:1rem 1.1rem;display:flex;align-items:center;justify-content:space-between;z-index:2}
      .bb-label{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#7a6a59;margin:0 0 .25rem}.bb-title{font-family:Fraunces,Georgia,serif;font-size:1.65rem;margin:0;color:#2c2118}.bb-close{border:0;background:#eadfcd;border-radius:999px;width:2.25rem;height:2.25rem;cursor:pointer;color:#2c2118}
      .bb-body{padding:1rem;display:grid;gap:1rem}.bb-offer{background:#2c2118;color:#f6f1e7;border-radius:1.2rem;padding:1rem}.bb-offer strong{color:#f3c7c7}.bb-progress{height:.48rem;background:rgba(246,241,231,.18);border-radius:999px;overflow:hidden;margin:.8rem 0 .4rem}.bb-bar{height:100%;width:50%;background:#f3c7c7;border-radius:999px;transition:width .25s}.bb-copy{font-size:.78rem;line-height:1.5;color:rgba(246,241,231,.74);margin:0}.bb-summary,.bb-card{border:1px solid #e8deca;background:rgba(255,255,255,.48);border-radius:1rem;padding:.9rem}.bb-row{display:flex;justify-content:space-between;gap:1rem;font-size:.86rem;margin:.35rem 0}.bb-save{color:#4e7a52}.bb-total{border-top:1px solid #e8deca;padding-top:.65rem;margin-top:.65rem;font-weight:700}.bb-card{display:flex;gap:.75rem}.bb-card img{width:72px;height:72px;object-fit:cover;border-radius:.8rem;background:#eadfcd}.bb-card p{margin:0}.bb-cat{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#7a6a59}.bb-name{font-size:.86rem;font-weight:700;color:#2c2118}.bb-price{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:#7a6a59;margin-top:.18rem!important}.bb-add,.bb-checkout{border:0;border-radius:.85rem;background:#2c2118;color:#f6f1e7;padding:.65rem .8rem;font-weight:700;font-size:.76rem;cursor:pointer}.bb-add{margin-top:.6rem}.bb-checkout{display:flex;justify-content:center;text-decoration:none;padding:.9rem 1rem;font-size:.9rem}.bb-note{text-align:center;font-size:.72rem;color:#7a6a59;line-height:1.45;margin:0}
    </style>
    <div id="banimal-basket-boost" aria-hidden="true">
      <aside class="bb-panel" role="dialog" aria-modal="true" aria-label="Basket boost">
        <div class="bb-head"><div><p class="bb-label">Basket boost</p><h2 class="bb-title">Complete the set</h2></div><button class="bb-close" type="button" aria-label="Close basket boost">×</button></div>
        <div class="bb-body"><div class="bb-offer"><p style="margin:0;font-weight:700">Add one more tiny-human essential and unlock <strong>10%</strong>.</p><div class="bb-progress"><div class="bb-bar"></div></div><p class="bb-copy">1 of 2 items to unlock bundle saving.</p></div><div class="bb-summary"></div><div><p style="font-size:.9rem;font-weight:700;margin:.1rem 0 .65rem">Most parents add this</p><div class="bb-recs"></div></div><a class="bb-checkout" href="/checkout?source=basket_boost&discount=10">Continue to secure checkout</a><p class="bb-note">Discount preview is shown in-basket; payment still runs through the proven Paystack checkout.</p></div>
      </aside>
    </div>
    <script id="banimal-basket-boost-script">
      (function(){
        var products=[
          {id:'BT001',name:'Classic White Babygrow',price:289,image:'https://banimal.co.za/assets/BT001-BYDvu1g2.png',category:'Babygrow'},
          {id:'BT002',name:'Soft Grey Babygrow',price:289,image:'https://banimal.co.za/assets/BT002-CX4CjBt9.png',category:'Babygrow'},
          {id:'BT003',name:'Beige Babygrow',price:289,image:'https://banimal.co.za/assets/BT003-Ynr1ODEe.png',category:'Babygrow'},
          {id:'BT004',name:'Sage Babygrow',price:289,image:'https://banimal.co.za/assets/BT004-KZ5X0Ak7.png',category:'Babygrow'},
          {id:'BR001',name:'Bandana Bib — Oatmeal',price:129,image:'https://banimal.co.za/assets/BR001-B9Svc9IF.png',category:'Bib'},
          {id:'BR002',name:'Bandana Bib — Slate',price:129,image:'https://banimal.co.za/assets/BR002-m4ScX5Ak.png',category:'Bib'}
        ];
        var cart=[];
        var drawer=document.getElementById('banimal-basket-boost');
        if(!drawer) return;
        function money(v){return 'R '+Math.round(v)}
        function event(name,data){try{window.va&&window.va('event',name,data)}catch(e){}}
        function findProduct(label){label=(label||'').toLowerCase();return products.find(function(p){return label.indexOf(p.name.toLowerCase())>-1})||products.find(function(p){return label.indexOf(p.id.toLowerCase())>-1})||products[0]}
        function render(){
          var subtotal=cart.reduce(function(s,p){return s+p.price},0), unlocked=cart.length>=2, saving=unlocked?subtotal*.10:0,total=subtotal-saving;
          drawer.querySelector('.bb-bar').style.width=Math.min(cart.length,2)*50+'%';
          drawer.querySelector('.bb-copy').textContent=unlocked?'Bundle saving unlocked.':'1 more item to unlock bundle saving.';
          drawer.querySelector('.bb-summary').innerHTML='<div class="bb-row"><span>Subtotal</span><strong>'+money(subtotal)+'</strong></div><div class="bb-row bb-save"><span>Bundle saving</span><strong>-'+money(saving)+'</strong></div><div class="bb-row bb-total"><span>Boosted total</span><strong>'+money(total)+'</strong></div>';
          var ids=cart.map(function(p){return p.id}), recs=products.filter(function(p){return ids.indexOf(p.id)===-1}).slice(0,3);
          drawer.querySelector('.bb-recs').innerHTML=recs.map(function(p){return '<div class="bb-card" data-id="'+p.id+'"><img src="'+p.image+'" alt=""><div><p class="bb-cat">'+p.category+'</p><p class="bb-name">'+p.name+'</p><p class="bb-price">'+money(p.price)+'</p><button class="bb-add" type="button">Add & save 10%</button></div></div>'}).join('');
          drawer.querySelector('.bb-checkout').href='/checkout?source=basket_boost&discount=10&total='+Math.round(total);
        }
        function open(product){if(product) cart.push(product);render();drawer.classList.add('show');drawer.setAttribute('aria-hidden','false');event('basket_boost_view',{cartCount:cart.length,lastProductId:product&&product.id,discountPercent:10})}
        drawer.addEventListener('click',function(e){
          var target=e.target;
          if((target.classList&&target.classList.contains('bb-close'))||target===drawer){drawer.classList.remove('show');drawer.setAttribute('aria-hidden','true')}
          var add=target.closest&&target.closest('.bb-add');
          if(add){var card=add.closest('.bb-card'),p=products.find(function(x){return x.id===card.getAttribute('data-id')});if(p){cart.push(p);event('basket_boost_accept',{productId:p.id,cartCount:cart.length,discountPercent:10});render()}}
        });
        document.addEventListener('click',function(e){var target=e.target,btn=target.closest&&target.closest('button[aria-label^="Add "]');if(!btn)return;setTimeout(function(){open(findProduct(btn.getAttribute('aria-label')))},0)});
        document.addEventListener('click',function(e){var target=e.target,link=target.closest&&target.closest('.bb-checkout');if(link)event('basket_boost_checkout',{cartCount:cart.length,discountPercent:10})});
      })();
    </script>
