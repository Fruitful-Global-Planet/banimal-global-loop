    <!-- Banimal — dark mode (warm charcoal, NYC-precise) + system-aware, persisted -->
    <style id="banimal-theme-polish">
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      html, body { transition: background-color .45s cubic-bezier(.4,0,.2,1), color .45s cubic-bezier(.4,0,.2,1); }
      html.dark img:not([src*=".svg"]) { filter: brightness(.94) contrast(1.02); }
      #banimal-theme-toggle {
        position: fixed; right: 1.5rem; bottom: 1.5rem; z-index: 2147483000;
        width: 46px; height: 46px; display: grid; place-items: center;
        border-radius: 9999px; cursor: pointer; padding: 0;
        background: hsl(var(--card) / .72);
        border: 1px solid hsl(var(--border));
        color: hsl(var(--foreground));
        -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
        box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px -8px rgba(0,0,0,.22);
        transition: transform .35s cubic-bezier(.34,1.56,.64,1), background .45s ease, border-color .45s ease, box-shadow .45s ease;
      }
      #banimal-theme-toggle:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 2px 4px rgba(0,0,0,.10), 0 14px 34px -10px rgba(0,0,0,.30); }
      #banimal-theme-toggle:active { transform: translateY(0) scale(.97); }
      #banimal-theme-toggle:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 3px; }
      #banimal-theme-toggle svg { width: 20px; height: 20px; transition: opacity .4s ease, transform .5s cubic-bezier(.4,0,.2,1); }
      #banimal-theme-toggle .bt-sun { position: absolute; opacity: 1; transform: rotate(0) scale(1); }
      #banimal-theme-toggle .bt-moon { position: absolute; opacity: 0; transform: rotate(-90deg) scale(.6); }
      html.dark #banimal-theme-toggle .bt-sun { opacity: 0; transform: rotate(90deg) scale(.6); }
      html.dark #banimal-theme-toggle .bt-moon { opacity: 1; transform: rotate(0) scale(1); }
      @media (prefers-reduced-motion: reduce) { html, body, #banimal-theme-toggle, #banimal-theme-toggle svg { transition: none !important; } }
    </style>
    <script>
      (function () {
        var KEY = 'banimal-theme';
        var root = document.documentElement;
        function systemDark(){ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
        function resolve(){ var s = localStorage.getItem(KEY); return s ? s === 'dark' : systemDark(); }
        function apply(dark){ root.classList.toggle('dark', !!dark); }
        // Apply before first paint — no flash.
        apply(resolve());
        // Follow the OS while the user hasn't made an explicit choice.
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
            if (!localStorage.getItem(KEY)) apply(e.matches);
          });
        }
        function mount(){
          if (document.getElementById('banimal-theme-toggle')) return;
          var btn = document.createElement('button');
          btn.id = 'banimal-theme-toggle';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Toggle dark mode');
          btn.setAttribute('title', 'Toggle theme');
          btn.innerHTML =
            '<svg class="bt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.6M12 19v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.4 12H5M19 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>' +
            '<svg class="bt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8 8 0 1 1 9.8 3.5a6.4 6.4 0 0 0 10.7 10.7Z"/></svg>';
          btn.addEventListener('click', function () {
            var dark = !root.classList.contains('dark');
            apply(dark);
            localStorage.setItem(KEY, dark ? 'dark' : 'light');
          });
          document.body.appendChild(btn);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount);
        else mount();
      })();
    </script>
