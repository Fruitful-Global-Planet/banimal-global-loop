name            = "banimal-router"
main            = "index.js"
compatibility_date  = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT       = "production"
BOBGO_FROM_POSTAL = "0044"

# ── Secrets (wrangler secret put <NAME>) ─────────────────────────────────────
#   PAYSTACK_SECRET_KEY   — from paystack.com/business/settings
#   CAPITECPAY_SECRET     — from CapitecPay merchant portal
#   BOBGO_API_KEY          — from app.bobgo.co.za/settings/api
#   EXCHANGE_RATE_API_KEY  — from exchangerate-api.com
#   RESEND_API_KEY         — from resend.com (digital download emails)
#   FAA_ETH_ADDRESS / FAA_BTC_ADDRESS / FAA_USDT_ADDRESS / FAA_XRP_ADDRESS

[[kv_namespaces]]
binding = "BANIMAL_KV"
id      = "b94b5f024375483abd194d7a79538d36"

# ── Routes intentionally REMOVED ─────────────────────────────────────────────
# banimal-router previously bound banimal.co.za/api/*, /webhooks/*, /port/5000/*
# and /assets/* (plus the www.* equivalents). Those routes are owned by the
# heyns1000/banimal Cloudflare Worker, which holds the live Paystack / CapitecPay
# / BobGo secrets. Binding them here hijacked /api onto this worker (which lacks
# those secrets), breaking Paystack with "Invalid key". Removing the bindings and
# redeploying releases the routes so the heyns1000/banimal worker serves them again.
#
# Do NOT re-add these route patterns unless this worker is intended to own the
# live API and has the required secrets set via `wrangler secret put`.
