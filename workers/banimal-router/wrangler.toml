name            = "banimal-router"
main            = "index.js"
compatibility_date  = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT       = "production"
BOBGO_FROM_POSTAL = "0044"

# ── Secrets (wrangler secret put <NAME>) ─────────────────────────────────────
#   PAYSTACK_SECRET_KEY   — from paystack.com/business/settings
#   CAPITECPAY_SECRET     — from CapitecPay merchant portal
#   BOBGO_API_KEY          — from app.bobgo.co.za/settings/api
#   EXCHANGE_RATE_API_KEY  — from exchangerate-api.com
#   RESEND_API_KEY         — from resend.com (digital download emails)
#   FAA_ETH_ADDRESS / FAA_BTC_ADDRESS / FAA_USDT_ADDRESS / FAA_XRP_ADDRESS

[[kv_namespaces]]
binding = "BANIMAL_KV"
id      = "b94b5f024375483abd194d7a79538d36"

# ── Routes ───────────────────────────────────────────────────────────────────
# banimal-router is the owner of the banimal.co.za API surface. The heyns1000/
# banimal worker does NOT bind these routes (its wrangler.json has routes:null),
# so these bindings must stay here or /api goes offline entirely.
#
# IMPORTANT: the Paystack / CapitecPay / BobGo / Resend keys are set as
# Environment Variables on this worker in the Cloudflare dashboard. A plain
# `wrangler deploy` REPLACES dashboard vars with only what is in this file and
# would wipe them — the deploy workflow now runs `deploy --keep-vars` to prevent
# that. Do not remove --keep-vars.

[[routes]]
pattern  = "banimal.co.za/api/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "banimal.co.za/webhooks/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "banimal.co.za/port/5000/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "banimal.co.za/assets/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "www.banimal.co.za/api/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "www.banimal.co.za/webhooks/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "www.banimal.co.za/port/5000/*"
zone_name = "banimal.co.za"

[[routes]]
pattern  = "www.banimal.co.za/assets/*"
zone_name = "banimal.co.za"
